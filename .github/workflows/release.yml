name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./module.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build archive
        run: zip -r module.zip module.json scripts src lang README.md CHANGELOG.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AI Them'All ${{ steps.version.outputs.version }}
          files: |
            module.json
            module.zip
